<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abhijat Saxena">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1806"/>
      <stop offset=".5" stop-color="#63390e"/>
      <stop offset=".85" stop-color="#96600f"/>
      <stop offset="1" stop-color="#b8761a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".45" stop-color="#ffefc4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd37a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd37a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc24d" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffc24d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e2701e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e2701e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb43c" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb43c" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#241300" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <ellipse cx="1080" cy="300" rx="330" ry="180" fill="url(#corner)"/>
  <ellipse cx="120" cy="20" rx="260" ry="140" fill="url(#corner)" opacity=".6"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ffd37a" stroke-opacity=".22"/>

  <circle cx="150" cy="250" r="170" fill="url(#orb1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -28; 0 0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="70" r="155" fill="url(#orb2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -38 26; 0 0" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="270" r="120" fill="url(#orb1)" opacity=".55">
    <animateTransform attributeName="transform" type="translate" values="0 0; 26 -18; 0 0" dur="23s" repeatCount="indefinite"/>
  </circle>

  <g fill="#fff3d6">
    <circle cx="228" cy="46" r="2.0" opacity=".62"><animate attributeName="opacity" values=".62;1;.62" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="272" r="1.3" opacity=".48"><animate attributeName="opacity" values=".48;.95;.48" dur="4.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="70" r="1.8" opacity=".54"><animate attributeName="opacity" values=".54;1;.54" dur="2.7s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="566" cy="248" r="1.2" opacity=".5"><animate attributeName="opacity" values=".5;.92;.5" dur="5.3s" begin="-3.9s" repeatCount="indefinite"/></circle>
    <circle cx="688" cy="52" r="2.1" opacity=".6"><animate attributeName="opacity" values=".6;1;.6" dur="3.1s" begin="-1.7s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="286" r="1.4" opacity=".45"><animate attributeName="opacity" values=".45;.9;.45" dur="4.1s" begin="-2.9s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="98" r="1.7" opacity=".52"><animate attributeName="opacity" values=".52;.98;.52" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1014" cy="258" r="1.2" opacity=".44"><animate attributeName="opacity" values=".44;.88;.44" dur="5.8s" begin="-4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="132" r="2.0" opacity=".58"><animate attributeName="opacity" values=".58;1;.58" dur="2.5s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="120" r="1.5" opacity=".5"><animate attributeName="opacity" values=".5;.94;.5" dur="4.9s" begin="-3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".18" stroke="#ffd37a" stroke-width="1" fill="none">
    <path d="M0 268 L1200 268"/>
    <path d="M0 52 L1200 52"/>
  </g>

  <text x="600" y="152" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#accent)" filter="url(#lift)">Abhijat Saxena</text>

  <rect x="330" y="184" width="540" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="228" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#fff6dc" letter-spacing=".4">Full-stack engineer · MCP servers · agent tooling · Firebase</text>
  <text x="600" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#ffe7a8" opacity=".95">→ github.com/AbhijatSaxena</text>
</svg>
