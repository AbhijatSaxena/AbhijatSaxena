<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abhijat Saxena">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c03"/>
      <stop offset=".45" stop-color="#3a2208"/>
      <stop offset=".8" stop-color="#7d4c12"/>
      <stop offset="1" stop-color="#a86a15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset=".45" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a02c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a02c" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd37a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffa92e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffa92e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e2701e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e2701e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="keylight" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb43c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb43c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="470" ry="190" fill="url(#keylight)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ffc24d" stroke-opacity=".18"/>

  <circle cx="150" cy="250" r="170" fill="url(#orb1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -28; 0 0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="70" r="155" fill="url(#orb2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -38 26; 0 0" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="270" r="120" fill="url(#orb1)" opacity=".55">
    <animateTransform attributeName="transform" type="translate" values="0 0; 26 -18; 0 0" dur="23s" repeatCount="indefinite"/>
  </circle>

  <g fill="#fff3d6">
    <circle cx="228" cy="46" r="2.0" opacity=".58"><animate attributeName="opacity" values=".58;1;.58" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="272" r="1.3" opacity=".44"><animate attributeName="opacity" values=".44;.92;.44" dur="4.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="70" r="1.8" opacity=".5"><animate attributeName="opacity" values=".5;.98;.5" dur="2.7s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="566" cy="248" r="1.2" opacity=".46"><animate attributeName="opacity" values=".46;.9;.46" dur="5.3s" begin="-3.9s" repeatCount="indefinite"/></circle>
    <circle cx="688" cy="52" r="2.1" opacity=".56"><animate attributeName="opacity" values=".56;1;.56" dur="3.1s" begin="-1.7s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="286" r="1.4" opacity=".42"><animate attributeName="opacity" values=".42;.88;.42" dur="4.1s" begin="-2.9s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="98" r="1.7" opacity=".48"><animate attributeName="opacity" values=".48;.96;.48" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1014" cy="258" r="1.2" opacity=".4"><animate attributeName="opacity" values=".4;.86;.4" dur="5.8s" begin="-4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="132" r="2.0" opacity=".54"><animate attributeName="opacity" values=".54;1;.54" dur="2.5s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="120" r="1.5" opacity=".46"><animate attributeName="opacity" values=".46;.92;.46" dur="4.9s" begin="-3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".2" stroke="#ffc24d" stroke-width="1" fill="none">
    <path d="M0 268 L1200 268"/>
    <path d="M0 52 L1200 52"/>
  </g>

  <text x="600" y="152" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#accent)" filter="url(#glow)">Abhijat Saxena</text>

  <rect x="330" y="184" width="540" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="228" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#ecd6ae" letter-spacing=".4">Full-stack engineer · MCP servers · agent tooling · Firebase</text>
  <text x="600" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#ffb94a" opacity=".9">→ github.com/AbhijatSaxena</text>
</svg>
