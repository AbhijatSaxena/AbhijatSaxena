<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abhijat Saxena">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c19"/>
      <stop offset=".5" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1a1442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#6ee7ff" stroke-opacity=".14"/>

  <circle cx="150" cy="250" r="165" fill="url(#orb1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -28; 0 0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="70" r="150" fill="url(#orb2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -38 26; 0 0" dur="19s" repeatCount="indefinite"/>
  </circle>

  <g fill="#ffffff">
    <circle cx="228" cy="46" r="2.0" opacity=".62"><animate attributeName="opacity" values=".62;1;.62" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="272" r="1.3" opacity=".48"><animate attributeName="opacity" values=".48;.95;.48" dur="4.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
    <circle cx="452" cy="70" r="1.8" opacity=".55"><animate attributeName="opacity" values=".55;1;.55" dur="2.7s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="566" cy="248" r="1.2" opacity=".5"><animate attributeName="opacity" values=".5;.92;.5" dur="5.3s" begin="-3.9s" repeatCount="indefinite"/></circle>
    <circle cx="688" cy="52" r="2.1" opacity=".6"><animate attributeName="opacity" values=".6;1;.6" dur="3.1s" begin="-1.7s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="286" r="1.4" opacity=".45"><animate attributeName="opacity" values=".45;.9;.45" dur="4.1s" begin="-2.9s" repeatCount="indefinite"/></circle>
    <circle cx="906" cy="98" r="1.7" opacity=".52"><animate attributeName="opacity" values=".52;.98;.52" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1014" cy="258" r="1.2" opacity=".44"><animate attributeName="opacity" values=".44;.88;.44" dur="5.8s" begin="-4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="132" r="2.0" opacity=".58"><animate attributeName="opacity" values=".58;1;.58" dur="2.5s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="120" r="1.5" opacity=".5"><animate attributeName="opacity" values=".5;.94;.5" dur="4.9s" begin="-3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity=".22" stroke="#8ab4ff" stroke-width="1" fill="none">
    <path d="M0 268 L1200 268"/>
    <path d="M0 52 L1200 52"/>
  </g>

  <text x="600" y="152" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="url(#accent)" filter="url(#glow)">Abhijat Saxena</text>

  <rect x="330" y="184" width="540" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="228" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#9fb2d4" letter-spacing=".4">Full-stack engineer · MCP servers · agent tooling · Firebase</text>
  <text x="600" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#67e8f9" opacity=".85">→ github.com/AbhijatSaxena</text>
</svg>
